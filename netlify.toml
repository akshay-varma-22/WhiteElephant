# Netlify build + hosting configuration.
# Docs: https://docs.netlify.com/build/configure-builds/file-based-configuration/

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# ---- Security headers (all pages) -------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), interest-cohort=()"
    # `challenges.cloudflare.com` is only used if the optional Turnstile CAPTCHA is enabled.
    # style-src 'unsafe-inline' is required for React inline style attributes.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# ---- Long-lived caching for fingerprinted build assets -----------------
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The video intro and its poster keep their file names when replaced, so cache them for a week (not "forever"). When one is
# replaced, raise VIDEO_VERSION in src/components/VideoIntro.jsx: the page then asks for a new address and skips the cached copy.
[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# The API endpoint must never be cached.
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

# ---- One address for search engines and visitors ----------------------
# The studio's own domain (BUSINESS.url in shared/business.js) is the only public address. Anyone arriving on the old
# `...netlify.app` address is sent to it, so search engines never see two copies of the site. (Deploy preview addresses
# such as `<id>--exquisite-beijinho-3476dc.netlify.app` are different host names and are not affected.)
[[redirects]]
  from = "https://exquisite-beijinho-3476dc.netlify.app/*"
  to = "https://www.whiteelephantcreativestudio.in/:splat"
  status = 301
  force = true
